<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pay AKCSE UBC by e-Transfer</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #FBF6F8; --surface: #FFFFFF; --line: #E7DAE1; --ink: #2B1A2B; --muted: #76606F;
  --accent: #C23B6E; --accent-ink: #FFFFFF; --good: #2C7A4B; --good-soft: #DDF1E4; --dough: #D9A066;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #18111A; --surface: #231925; --line: #3A2B3B; --ink: #F5EAF1; --muted: #B59EAF;
    --accent: #F06C9E; --accent-ink: #1A0F16; --good: #72D49C; --good-soft: #183528; --dough: #B8834F; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 17px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif;
  padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
main { max-width: 440px; margin: 0 auto; display: grid; gap: 18px; text-align: center; }
.brand { display: flex; gap: 10px; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
h1 { font: 800 2rem/1.1 "Bricolage Grotesque", system-ui, sans-serif; margin: 0; text-wrap: balance; }
.amt { font: 800 3.2rem/1 "Bricolage Grotesque", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.amt-l { color: var(--muted); font-size: .9rem; margin-top: -10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.em { font: 500 1.2rem "IBM Plex Mono", ui-monospace, monospace; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
button { font: inherit; font-weight: 700; font-size: 1.15rem; border: 0; border-radius: 12px; padding: 16px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); width: 100%; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button.done { background: var(--good-soft); color: var(--good); }
ol { text-align: left; margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.muted { color: var(--muted); font-size: .9rem; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="12" fill="none" stroke="var(--dough)" stroke-width="13"/><circle cx="20" cy="20" r="12" fill="none" stroke="var(--accent)" stroke-width="9"/></svg>
    AKCSE UBC Doughnuts
  </div>
  <h1>Pay by Interac e-Transfer</h1>
  <div id="amt-wrap" hidden><div class="amt" id="amt"></div><div class="amt-l">your total</div></div>
  <div class="card">
    <div class="em" id="em">akcse2026@gmail.com</div>
    <button id="copy" type="button">Copy email</button>
  </div>
  <ol>
    <li>Open your bank app and choose <b>Interac e-Transfer</b>.</li>
    <li>Add a new contact and paste the email.</li>
    <li>Send <span id="amt-inline">your total</span>, then show us the confirmation screen.</li>
  </ol>
  <p class="muted">Thanks for supporting AKCSE UBC!</p>
</main>
<script>
(() => {
  const EMAIL = "akcse2026@gmail.com";
  const btn = document.getElementById("copy");
  const p = new URLSearchParams(location.search);
  const amt = parseFloat(p.get("amt"));
  if (isFinite(amt) && amt > 0 && amt < 10000) {
    const s = "$" + amt.toFixed(2);
    document.getElementById("amt").textContent = s;
    document.getElementById("amt-inline").textContent = s;
    document.getElementById("amt-wrap").hidden = false;
  }
  function done() { btn.textContent = "Copied ✓ Now open your bank app"; btn.classList.add("done"); }
  function legacyCopy() {
    const t = document.createElement("textarea");
    t.value = EMAIL; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, EMAIL.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    t.remove(); return ok;
  }
  function selectEmail() { const r = document.createRange(); r.selectNodeContents(document.getElementById("em")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(EMAIL); done(); return; } catch {}
    if (legacyCopy()) { done(); return; }
    selectEmail(); btn.textContent = "Press and hold the email to copy";
  });
  // Some browsers (mostly Android Chrome) allow copying right away; the rest need the tap.
  if (navigator.clipboard && document.hasFocus()) navigator.clipboard.writeText(EMAIL).then(done, () => {});
})();
</script>
</body>
</html>
